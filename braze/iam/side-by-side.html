<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Rugiet — Side-by-Side Modal</title>
    <!--
        Rugiet × Braze IAM — Side-by-Side Modal Template

        Image-left / content-right layout on desktop (≥ 680px),
        stacking to image-top / content-bottom on mobile. Suited for
        email capture modals, promotional offers, seasonal campaigns,
        and any message where a hero lifestyle image should sit
        alongside the copy rather than above it.

        Brand foundations live in /braze/iam/tokens.css and the Rugiet
        Design System handoff.

        Deployment checklist:
        [x] All brand fonts (Review Regular, Regular Italic, Bold,
            Wide Black; Redward Mono Regular, Light) are uploaded to
            Braze with production CDN URLs hardcoded below.
        [ ] Upload the hero lifestyle image to Braze Media Library.
            Replace REPLACE_HERO_IMAGE with the CDN URL.
        [ ] Replace href="#" on the CTA with the destination URL or
            deep link (e.g. rugiet://offers or https://rugiet.com/offer).
        [ ] Edit the headline, body, form placeholder, button label,
            and legal copy for the campaign. Liquid personalization
            (e.g. {{${first_name}}}) is supported anywhere in the HTML body.
        [ ] Paste the final HTML into the Braze Dashboard → In-App Message
            composer → Custom Code.

        Structural notes:
        - Desktop: flexbox row, image 50% / content 50%, max-width 960px.
        - Mobile (< 680px): flexbox column, image on top, content below,
          max-width 420px.
        - Hero image uses object-fit: cover and fills its panel entirely.
        - Form includes inline email validation and error state.
        - Content panel background defaults to --rugiet-orange for
          promotional treatments. Swap to --rugiet-cream or --rugiet-white
          for editorial treatments.

        Interaction model:
        - CTA submit → brazeBridge.logClick('0') + close
        - Close X → brazeBridge.closeMessage()
    -->
    <style>
        @font-face {
            font-family: 'Review';
            font-weight: 400;
            font-style: normal;
            font-display: swap;
            src: local('Review Regular'),
                 url('https://braze-images.com/appboy/communication/assets/font_assets/files/69f167a116c74d00887c750f/original.otf?1777428385') format('opentype'),
                 url('./fonts/Review-Regular.otf') format('opentype');
        }
        @font-face {
            font-family: 'Review';
            font-weight: 400;
            font-style: italic;
            font-display: swap;
            src: local('Review Regular Italic'),
                 url('https://braze-images.com/appboy/communication/assets/font_assets/files/69f167a0df9d180088c42cba/original.otf?1777428383') format('opentype'),
                 url('./fonts/Review-RegularItalic.otf') format('opentype');
        }
        @font-face {
            font-family: 'Review';
            font-weight: 700;
            font-style: normal;
            font-display: swap;
            src: local('Review Bold'),
                 url('https://braze-images.com/appboy/communication/assets/font_assets/files/69f167a028ccd700880080e7/original.otf?1777428384') format('opentype'),
                 url('./fonts/Review-Bold.otf') format('opentype');
        }
        @font-face {
            font-family: 'Review Wide';
            font-weight: 900;
            font-style: normal;
            font-display: swap;
            src: local('Review Wide Black'),
                 url('https://braze-images.com/appboy/communication/assets/font_assets/files/69f167a024a17e008a3616f1/original.otf?1777428383') format('opentype'),
                 url('./fonts/ReviewWide-Black.otf') format('opentype');
        }
        @font-face {
            font-family: 'Redward Mono';
            font-weight: 400;
            font-style: normal;
            font-display: swap;
            src: local('Redward Mono Regular'),
                 url('https://braze-images.com/appboy/communication/assets/font_assets/files/69f167a0c08e29008ad72571/original.otf?1777428383') format('opentype'),
                 url('./fonts/Redward-Mono-Regular.otf') format('opentype');
        }
        @font-face {
            font-family: 'Redward Mono';
            font-weight: 300;
            font-style: normal;
            font-display: swap;
            src: local('Redward Mono Light'),
                 url('https://braze-images.com/appboy/communication/assets/font_assets/files/69f167a093c3c90088050a48/original.otf?1777428383') format('opentype'),
                 url('./fonts/Redward-Mono-Light.otf') format('opentype');
        }

        :root {
            --rugiet-black:   #000000;
            --rugiet-white:   #FFFFFF;
            --rugiet-orange:  #FFA202;
            --rugiet-orange-deep: #FF5600;
            --rugiet-cream:   #FFFCF9;
            --rugiet-gray-10: #E7E5E4;
            --rugiet-gray-30: #A8A29F;
            --rugiet-gray-40: #78716C;
            --rugiet-gray-60: #292524;
            --rugiet-gray-70: #1B1917;

            --rugiet-font-display: 'Review Wide', 'Archivo Black', 'Arial Black', system-ui, sans-serif;
            --rugiet-font-text:    'Review', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            --rugiet-font-mono:    'Redward Mono', 'JetBrains Mono', ui-monospace, monospace;

            --rugiet-ease-out: cubic-bezier(0.2, 0, 0, 1);
        }

        *, *::before, *::after { box-sizing: border-box; }
        body, h1, h2, h3, h4, p, ul, ol, li, figure, figcaption, blockquote, dl, dd { margin: 0; }
        body {
            min-height: 100vh;
            scroll-behavior: smooth;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            line-height: 1.4;
            font-family: var(--rugiet-font-text);
            color: var(--rugiet-black);
        }
        img { max-width: 100%; display: block; }
        input, button, a, textarea, select { font: inherit; }
        button, a { border: none; background-color: transparent; text-decoration: none; color: inherit; }
        button:focus, a:focus { outline: none; }

        /* ── Overlay ─────────────────────────────────────────────── */
        .overlay {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            background-color: rgba(0, 0, 0, 0.78);
            z-index: 99999;
        }

        /* ── Modal shell ─────────────────────────────────────────── */
        .modal {
            display: flex;
            flex-direction: column;
            max-width: 420px;
            width: 92vw;
            margin: auto;
            overflow: hidden;
        }

        /* ── Hero image panel ────────────────────────────────────── */
        .modal__hero {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .modal__hero-img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        /* ── Close X ─────────────────────────────────────────────── */
        .modal__close {
            position: absolute;
            top: 16px;
            right: 16px;
            height: 32px;
            width: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--rugiet-white);
            cursor: pointer;
            transition: opacity 240ms var(--rugiet-ease-out);
            z-index: 3;
            padding: 0;
            background: rgba(0, 0, 0, 0.35);
            border: none;
            border-radius: 50%;
        }
        .modal__close:hover { opacity: 0.62; }
        .modal__close svg { width: 16px; height: 16px; }

        /* ── Content panel ───────────────────────────────────────── */
        .modal__content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 32px 28px 28px;
            background-color: var(--rugiet-orange);
        }

        .modal__headline {
            font-family: var(--rugiet-font-display);
            font-weight: 900;
            font-size: 28px;
            line-height: 0.92;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            color: var(--rugiet-black);
            margin: 0 0 14px;
        }

        .modal__body {
            font-family: var(--rugiet-font-text);
            font-weight: 400;
            font-size: 15px;
            line-height: 1.5;
            color: var(--rugiet-black);
            opacity: 0.85;
            margin: 0 0 24px;
            max-width: 340px;
        }

        /* ── Form ────────────────────────────────────────────────── */
        .modal__form { width: 100%; max-width: 340px; }

        .modal__input {
            width: 100%;
            height: 52px;
            border: 2px solid var(--rugiet-black);
            border-radius: 0;
            background: var(--rugiet-white);
            padding: 0 16px;
            font-family: var(--rugiet-font-text);
            font-size: 15px;
            color: var(--rugiet-black);
            outline: none;
            transition: border-color 240ms var(--rugiet-ease-out);
            margin-bottom: 12px;
        }
        .modal__input::placeholder { color: var(--rugiet-orange); opacity: 0.8; }
        .modal__input:focus { border-color: var(--rugiet-black); }
        .modal__input--error { border-color: #c0392b; }

        .modal__error {
            font-family: var(--rugiet-font-text);
            color: #c0392b;
            font-size: 12px;
            margin-top: -8px;
            margin-bottom: 8px;
            display: none;
        }
        .modal__error--visible { display: block; }

        .modal__btn {
            width: 100%;
            height: 54px;
            border: 2px solid var(--rugiet-black);
            border-radius: 0;
            background: var(--rugiet-black);
            color: var(--rugiet-white);
            font-family: var(--rugiet-font-display);
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 240ms var(--rugiet-ease-out);
        }
        .modal__btn:hover { opacity: 0.88; }
        .modal__btn:active { opacity: 0.78; }

        /* ── Legal ───────────────────────────────────────────────── */
        .modal__legal {
            margin-top: 16px;
            font-family: var(--rugiet-font-text);
            font-size: 11px;
            line-height: 1.5;
            color: var(--rugiet-black);
            opacity: 0.7;
            text-align: center;
            max-width: 340px;
        }
        .modal__legal a {
            color: var(--rugiet-black);
            text-decoration: underline;
        }

        /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
           DESKTOP: side-by-side at ≥ 680px
           ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
        @media (min-width: 680px) {
            .modal {
                flex-direction: row;
                max-width: 960px;
                width: 94vw;
                min-height: 520px;
                max-height: 90vh;
            }

            .modal__hero {
                flex: 0 0 50%;
                position: relative;
            }

            .modal__hero-img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                aspect-ratio: auto;
            }

            .modal__content {
                flex: 1;
                justify-content: center;
                padding: 48px 44px;
            }

            .modal__headline { font-size: 32px; }
        }

        /* ── Small mobile ────────────────────────────────────────── */
        @media (max-width: 320px) {
            .overlay { overflow-y: scroll; }
        }
    </style>
</head>

<body>
    <div class="overlay">
        <div class="modal">

            <!-- ── Hero image panel ────────────────────────────── -->
            <div class="modal__hero">
                <img class="modal__hero-img"
                     src="REPLACE_HERO_IMAGE"
                     alt="" />

                <button onclick="brazeBridge.closeMessage()"
                    class="modal__close" aria-label="Close">
                    <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 2L18 18M18 2L2 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" />
                    </svg>
                </button>
            </div>

            <!-- ── Content panel ───────────────────────────────── -->
            <div class="modal__content">
                <h1 class="modal__headline">Headline goes<br>here</h1>
                <p class="modal__body">
                    Body copy goes here. Describe the offer, the value,
                    and what happens when they sign up.
                </p>

                <div class="modal__form">
                    <input
                        class="modal__input"
                        id="emailInput"
                        type="email"
                        placeholder="Your email"
                        autocomplete="email"
                        inputmode="email"
                        aria-label="Email address"
                    />
                    <p class="modal__error" id="errorMsg">Please enter a valid email address</p>
                    <button class="modal__btn" onclick="handleSubmit()">Primary CTA</button>
                </div>

                <p class="modal__legal">
                    Legal copy goes here. Link to
                    <a href="#" target="_blank">Terms and Conditions</a>
                    and <a href="#" target="_blank">Privacy Policy</a>.<br>
                    Exclusions and disclaimers.
                </p>
            </div>

        </div>
    </div>

    <script>
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function handleSubmit() {
            var input = document.getElementById('emailInput');
            var errorMsg = document.getElementById('errorMsg');
            var email = (input.value || '').trim();

            if (!isValidEmail(email)) {
                input.classList.add('modal__input--error');
                errorMsg.classList.add('modal__error--visible');
                return;
            }

            input.classList.remove('modal__input--error');
            errorMsg.classList.remove('modal__error--visible');

            brazeBridge.getUser().setEmail(email);
            brazeBridge.logClick('0');
            brazeBridge.closeMessage();
        }

        document.getElementById('emailInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleSubmit();
        });

        document.getElementById('emailInput').addEventListener('input', function() {
            this.classList.remove('modal__input--error');
            document.getElementById('errorMsg').classList.remove('modal__error--visible');
        });
    </script>

</body>

</html>
